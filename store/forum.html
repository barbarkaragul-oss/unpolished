<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Community</title>
<style>
  body { margin: 0; font: 15px/1.5 system-ui, "Segoe UI", sans-serif; color: #1f2328; background: #f3f4f6; }
  header { height: 56px; background: #fff; border-bottom: 1px solid #e5e7eb; display: flex; align-items: center; padding: 0 28px; gap: 14px; font-weight: 700; }
  header i { width: 26px; height: 26px; border-radius: 7px; background: #4f46e5; display: inline-block; }
  main { width: 720px; margin: 28px 0 0 60px; }
  .post { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 18px 22px; }
  .post h1 { font-size: 20px; margin: 0 0 6px; } .meta { color: #6b7280; font-size: 13px; margin-bottom: 10px; }
  .reply { margin-top: 18px; background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 16px 18px; }
  .reply b { display: block; margin-bottom: 8px; font-size: 14px; }
  textarea { width: 100%; box-sizing: border-box; height: 200px; border: 1px solid #c7ccd4; border-radius: 10px; padding: 12px 14px; font: 15px/1.55 system-ui, sans-serif; resize: none; }
  textarea:focus { outline: 2px solid #4f46e5; outline-offset: 0; }
  button.send { margin-top: 10px; background: #4f46e5; color: #fff; border: 0; border-radius: 8px; padding: 9px 16px; font-weight: 600; }
</style>
</head>
<body>
  <header><i></i> Community</header>
  <main>
    <div class="post">
      <h1>Show your side project: what did you build this month?</h1>
      <div class="meta">posted in Makers · 214 replies</div>
      Tell us what you made, who it is for, and what you learned building it.
    </div>
    <div class="reply">
      <b>Your reply</b>
      <textarea id="box">hi everyone. i am solo dev from turkey and my english is not good, sorry. i build small tool that show you why your github action not run when you push code. it check the cron and the if conditions and tell you real reason. i make it because i lost many hours on this problem myself.</textarea>
      <button class="send">Reply</button>
    </div>
  </main>
  <script>window.chrome = { runtime: { getURL: (p) => new URL(p, location.href).href, onMessage: { addListener() {} } } };</script>
  <script src="content.js"></script>
</body>
</html>
